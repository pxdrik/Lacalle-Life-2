name: CI

# P1-03 (auditoria de release, 02/09/2026): antes deste arquivo, nada
# impedia um `git push` para `main` com typecheck, lint, teste ou build
# quebrado — o único portão era o social ("npm run verify" documentado em
# CLAUDE.md, sem imposição técnica nenhuma). Este workflow roda exatamente
# os mesmos comandos que CLAUDE.md já pede antes de qualquer entrega
# ("npm run verify" verde, "npm run build" passando), como CI de verdade em
# vez de disciplina de quem está codando.
#
# Não substitui branch protection — só bloqueia merge se o repositório
# exigir este workflow como "required status check" nas configurações do
# GitHub (Settings → Branches → Branch protection rules). Ver nota no README.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.9.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # `npm ci` instala o pacote `playwright`, não o navegador: o binário do
      # Chromium é baixado à parte, para um cache fora de node_modules. Sem
      # este passo, `npm run verify` chegaria verde no typecheck, no lint e
      # nos testes unitários e morreria no projeto `browser` por não achar
      # navegador nenhum — falha de ambiente disfarçada de falha de teste.
      #
      # `--with-deps` traz também as bibliotecas de sistema que o Chromium
      # headless precisa no Ubuntu, que uma imagem limpa não tem. Só
      # `chromium` porque é o único navegador que `vitest.config.ts` declara.
      - name: Install Chromium for Browser Mode
        run: npx playwright install --with-deps chromium

      # Um comando só, o mesmo que CLAUDE.md pede antes de qualquer entrega:
      # typecheck, lint, testes unitários e testes de navegador. Chamar os
      # quatro separadamente aqui criaria um segundo lugar onde a composição
      # do portão está escrita, e os dois só podem divergir.
      - name: Verify (typecheck + lint + unit + browser)
        run: npm run verify

      - name: Build
        run: npm run build
