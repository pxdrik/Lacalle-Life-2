<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- O favicon, construído pela pág. 15 do Brand System. Cada número aqui vem
       de lá: o raio é 22,5% do lado (7,2 de 32), o símbolo ocupa 46% da largura
       do canvas (14,72), e o gradiente da submarca corre a 150° entre o
       emerald-500 e o emerald-600 — o único lugar em que o acento pode dominar
       100% da superfície.

       O traço é `MARK_ICON_PATH`, a versão com ajuste óptico: mesma silhueta,
       vão entre as superfícies alargado para não fechar na rasterização de
       16 px. `mark.test.ts` compara este `d` com o do módulo. -->
